[package]
name = "fragtape"
version = "0.2.1"
edition = "2021"
description = "Fragtape: automatic game recording and highlights, powered by a hidden OBS"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Registry", "Win32_Networking_WinHttp", "Win32_Security", "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_Graphics_Dwm", "Win32_UI_Controls_Dialogs",
] }

# the native window (Slint, software renderer) and video playback (Media Foundation)
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software",
  "software-renderer-path", "software-renderer-systemfonts", "image-default-formats", "raw-window-handle-06"] }
png = "0.18"
raw-window-handle = "0.6"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_MediaFoundation",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Variant"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
